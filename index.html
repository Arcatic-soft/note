<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:#fff;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#000}
#bar{flex:none;display:flex;align-items:center;gap:2px;background:rgb(255,255,230);
padding:5px 8px;overflow-x:auto;overflow-y:hidden;box-shadow:0 1px 0 rgba(0,0,0,.2);z-index:10;user-select:none}
#bar button{flex:none;border:0;background:transparent;border-radius:5px;min-width:34px;height:34px;

#bar button:hover{background:rgba(0,0,0,.08)}

#btnMenu{font-size:18px;font-weight:600}
#bar #btnB b{font-size:16px;font-weight:600;font-family:inherit}
#bar [data-cmd="insertUnorderedList"]{font-size:18px;font-weight:600}
#bar [data-cmd="insertOrderedList"]{font-size:14px;font-weight:600}

#btnHl,#btnColor{font-size:17px}

#btnSheets{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
#editor{flex:1;overflow-y:auto;padding:12px 14px 35vh;outline:none;color:#000;font-size:16px;line-height:1.35;word-wrap:break-word}
#editor:empty::before{content:'Начните печатать…';color:#9a9a9a}
#editor a{color:#1a3d9c;text-decoration:underline}
#editor ul,#editor ol{margin:0;padding:0;list-style:none}
#editor li{position:relative;margin:0;padding:0 0 0 1em}
#editor li::before{content:'•';position:absolute;left:0;top:0}
#editor ol{counter-reset:nb}
#editor ol li{counter-increment:nb;padding-left:1.5em}
#editor ol li::before{content:counter(nb) '.';left:0}
#editor img{max-width:100%;display:block;margin:6px 0;border-radius:4px}
.menu{position:fixed;background:#fff;border:1px solid #bbb;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.25);

.menu .item{display:block;width:100%;text-align:left;padding:9px 10px;border:0;background:none;border-radius:5px;

#helpBox button{border:0;background:#f0f0f0;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}

<body>
<!-- ═══════ ШАПКА ═══════ -->
<div id="bar">

<div id="bPanel" class="menu hidden"></div>

<div id="linkMenu" class="menu hidden"></div>
<div id="linkPanel" class="menu hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js" onerror="window.__noDocx=1"></script>
<script>
(function(){
"use strict";
var LS_KEY='nb_lite_v1';var isTouch=('ontouchstart' in window);
var editor=document.getElementById('editor');
var mainMenu=document.getElementById('mainMenu'), emojiPanel=document.getElementById('emojiPanel'),
hlPanel=document.getElementById('hlPanel'), colorPanel=document.getElementById('colorPanel'), bPanel=document.getElementById('bPanel'),
alignPanel=document.getElementById('alignPanel'), sheetsMenu=document.getElementById('sheetsMenu'),
linkMenu=document.getElementById('linkMenu'), linkPanel=document.getElementById('linkPanel'), trashMenu=document.getElementById('trashMenu'),
ctxMenu=document.getElementById('ctxMenu');
var btnSheets=document.getElementById('btnSheets');
var lastError='';
document.execCommand('styleWithCSS',false,true);
/* ═══════ листы ═══════ */
var state={pages:[],current:null,trash:[]}, saveTimer=null;
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){try{return decodeURIComponent(escape(atob(s)));}catch(e){return '';}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function makePage(name){return {id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
name:name||('Лист '+(state.pages.length+1)), content:'', updated:null};}
function curPage(){for(var i=0;i<state.pages.length;i++)if(state.pages[i].id===state.current)return state.pages[i];return state.pages[0];}
function findPage(id){for(var i=0;i<state.pages.length;i++)if(state.pages[i].id===id)return state.pages[i];return null;}
function loadState(d){
if(d&&d.pages&&d.pages.length){
state.pages=d.pages.map(function(p){return {id:p.id,name:p.name||'Лист',
content:(p.enc==='b64')?b64d(p.content||''):(p.content||''),updated:p.updated};});
state.current=d.current||state.pages[0].id;
if(!curPage())state.current=state.pages[0].id;
}else if(d&&d.content){
var p=makePage('Лист 1');p.content=(d.enc==='b64')?b64d(d.content):d.content;
state.pages=[p];state.current=p.id;
}else{
var p1=makePage('Лист 1');state.pages=[p1];state.current=p1.id;
}
state.trash=(d&&d.trash)?d.trash.map(function(t){return {id:t.id,name:t.name||'Лист',
content:(t.enc==='b64')?b64d(t.content||''):(t.content||''),deleted:t.deleted};}):[];
editor.innerHTML=curPage().content||'';
if(linkifyEditor())scheduleSave();
renderSheetsBtn();
}
/* ═══════ локальная копия ═══════ */
var lsWarned=false;
function writeLS(){try{localStorage.setItem(LS_KEY,buildPayload());}catch(e){
if(!lsWarned){lsWarned=true;alert('⚠ Локальное хранилище переполнено, последние изменения могли не сохраниться. Удали крупные картинки или экспортируй текст: меню ☰ → Экспорт.');}}
}
function readLS(){try{var t=localStorage.getItem(LS_KEY);if(t)return JSON.parse(t);}catch(e){}return null;}
function latest(d){var m='';if(d&&d.pages){for(var i=0;i<d.pages.length;i++){var u=d.pages[i].updated||'';if(u>m)m=u;}}
if(d&&d.updated&&d.updated>m)m=d.updated;return m;}
/* ═══════ сохранение ═══════ */
function setStatus(k){}
function syncFromEditor(){var p=curPage();if(p){p.content=editor.innerHTML;p.updated=new Date().toISOString();}}
function buildPayload(){return JSON.stringify({v:2,current:state.current,
pages:state.pages.map(function(p){return {id:p.id,name:p.name,updated:p.updated,enc:'b64',content:b64e(p.content||'')};}),
trash:state.trash.map(function(t){return {id:t.id,name:t.name,deleted:t.deleted,enc:'b64',content:b64e(t.content||'')};})});}
function save(){syncFromEditor();writeLS();}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(function(){saveTimer=null;save();},900);}
window.addEventListener('beforeunload',function(){
if(saveTimer){clearTimeout(saveTimer);saveTimer=null;save();}
});
/* ═══════ форматирование ═══════ */
function exec(cmd,val){editor.focus();document.execCommand(cmd,false,val||null);scheduleSave();}
Array.prototype.forEach.call(document.querySelectorAll('#bar [data-cmd]'),function(b){
b.addEventListener('click',function(){exec(b.getAttribute('data-cmd'));});
});
document.getElementById('bar').addEventListener('mousedown',function(e){e.preventDefault();});
document.addEventListener('mousedown',function(e){if(e.target.closest&&e.target.closest('.menu'))e.preventDefault();});
/* ═══════ меню ☰ ═══════ */
document.getElementById('btnMenu').addEventListener('click',function(){
if(!mainMenu.classList.contains('hidden')){hide(mainMenu);return;}
mainMenu.innerHTML='';
function item(txt,fn){var b=document.createElement('button');b.className='item';b.textContent=txt;
b.addEventListener('click',function(){hide(mainMenu);fn();});mainMenu.appendChild(b);}
item('↶ Отменить',function(){exec('undo');});
item('↷ Вернуть',function(){exec('redo');});
var sep=document.createElement('div');sep.className='msep';mainMenu.appendChild(sep);
item('＋ Добавить лист',addPage);
item('✎ Переименовать лист',function(){renamePage(state.current);});
item('🗑 Удалить лист',function(){deletePage(state.current);});
var sep2=document.createElement('div');sep2.className='msep';mainMenu.appendChild(sep2);
/* подменю «Экспорт» (раскрывается) */
var expHead=document.createElement('button');expHead.className='item';expHead.textContent='📤 Экспорт ▸';
var expWrap=document.createElement('div');expWrap.style.display='none';
function eitem(txt,fn){var b=document.createElement('button');b.className='item';b.textContent=txt;
b.style.paddingLeft='24px';
b.addEventListener('click',function(){hide(mainMenu);fn();});expWrap.appendChild(b);}
eitem('📄 PDF',doPdf);
eitem('📘 DOCX',doDocx);
eitem('📃 TXT',doTxt);
eitem('Ⓜ Экспорт Markdown',doMd);
eitem('Ⓜ Импорт Markdown',doMdImport);
expHead.addEventListener('click',function(){
var open=expWrap.style.display!=='none';
expWrap.style.display=open?'none':'block';
expHead.textContent=open?'📤 Экспорт ▸':'📤 Экспорт ▾';
});
mainMenu.appendChild(expHead);mainMenu.appendChild(expWrap);
var sep3=document.createElement('div');sep3.className='msep';mainMenu.appendChild(sep3);
item(document.body.classList.contains('dark')?'☀ Светлая тема':'🌙 Тёмная тема',toggleDark);
item('🗑 Корзина',openTrash);
item('❓ Справка',openHelp);
toggle(mainMenu,this,true);
});
/* ═══════ панель B (начертание) ═══════ */
(function(){
var b=document.createElement('button');b.className='item';b.textContent='Обычный';
b.addEventListener('click',function(){editor.focus();
['bold','italic','underline','strikeThrough'].forEach(function(c){
try{if(document.queryCommandState(c))document.execCommand(c,false,null);}catch(e){}
});
scheduleSave();hide(bPanel);});
bPanel.appendChild(b);
})();
[['bold','Жирный (Ctrl+B)'],['italic','Наклон (Ctrl+I)'],['underline','Подчёркнутый (Ctrl+U)'],['strikeThrough','Зачёркнутый']]
.forEach(function(c){
var b=document.createElement('button');b.className='item';b.textContent=c[1];
b.addEventListener('click',function(){exec(c[0]);hide(bPanel);});
bPanel.appendChild(b);
});
document.getElementById('btnB').addEventListener('click',function(){toggle(bPanel,this);});
/* ═══════ панель выравнивания ═══════ */
[['justifyLeft','Слева'],['justifyCenter','Центр'],['justifyRight','Справа'],['justifyFull','По ширине']]
.forEach(function(c){
var b=document.createElement('button');b.className='item';b.textContent=c[1];
b.addEventListener('click',function(){exec(c[0]);hide(alignPanel);});
alignPanel.appendChild(b);
});
document.getElementById('btnAlign').addEventListener('click',function(){toggle(alignPanel,this);});
/* ═══════ ссылка ═══════ */
function insertLink(){
var title=prompt('Текст ссылки:');if(title===null)return;if(!title)title='ссылка';
var url=prompt('Адрес ссылки:','https://');if(url===null)return;url=url.trim();
if(!url||url==='https://')return;
if(!/^(https?:|mailto:)/i.test(url))url='https://'+url;
exec('insertHTML','<a href="'+esc(url)+'" style="color:#1a3d9c;text-decoration:underline">'+esc(title)+'</a>&nbsp;');
}
/* ═══════ автоссылки: голая ссылка становится кликабельной ═══════ */
var URL_RX=/https?:\/\/[^\s<>"']+/gi;
function styleLink(a){a.style.color='#1a3d9c';a.style.textDecoration='underline';}
function linkifyTextNode(n){
var t=n.nodeValue;URL_RX.lastIndex=0;
if(!URL_RX.test(t))return false;
URL_RX.lastIndex=0;
var frag=document.createDocumentFragment(),last=0,m;
while((m=URL_RX.exec(t))){
var raw=m[0],url=raw.replace(/[.,;:!?]+$/,''),tail=raw.slice(url.length);
if(m.index>last)frag.appendChild(document.createTextNode(t.slice(last,m.index)));
var a=document.createElement('a');a.href=url;a.textContent=url;styleLink(a);
frag.appendChild(a);
if(tail)frag.appendChild(document.createTextNode(tail));
last=m.index+raw.length;
}
if(last<t.length)frag.appendChild(document.createTextNode(t.slice(last)));
n.parentNode.replaceChild(frag,n);
return true;
}
function linkifyEditor(){
var walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT,null),nodes=[];
while(walker.nextNode()){
var n=walker.currentNode,p=n.parentElement;
if(p&&p.closest&&p.closest('a'))continue;
nodes.push(n);
}
var ch=false;
for(var i=0;i<nodes.length;i++){if(linkifyTextNode(nodes[i]))ch=true;}
return ch;
}
function autolinkBeforeCaret(){
var sel=window.getSelection();
if(!sel.rangeCount||!sel.isCollapsed)return;
var n=sel.anchorNode;
if(!n||n.nodeType!==3)return;
var p=n.parentElement;
if(p&&p.closest&&p.closest('a'))return;
var o=sel.anchorOffset,t=n.nodeValue;
var m=t.slice(0,o).match(/(?:^|\s)(https?:\/\/[^\s<>"']+)$/);
if(!m)return;
var r=document.createRange();
r.setStart(n,o-m[1].length);r.setEnd(n,o);
var a=document.createElement('a');a.href=m[1];a.textContent=m[1];styleLink(a);
try{r.surroundContents(a);}catch(e){return;}
var r2=document.createRange();r2.setStartAfter(a);r2.collapse(true);
sel.removeAllRanges();sel.addRange(r2);
scheduleSave();
}
editor.addEventListener('keydown',function(e){
if(e.ctrlKey||e.altKey||e.metaKey)return;
if(e.key===' '||e.key==='Enter')autolinkBeforeCaret();
});
/* ═══════ панель 🔗: чек-лист, списки, ссылка ═══════ */
[['☑ Чек-лист список',insertChecklist],
['• Маркированный список',function(){exec('insertUnorderedList');}],
['1. Нумерованный список',function(){exec('insertOrderedList');}],
['🔗 Вставить ссылку',insertLink]].forEach(function(c){
var b=document.createElement('button');b.className='item';b.textContent=c[0];
b.addEventListener('click',function(){hide(linkPanel);c[1]();});
linkPanel.appendChild(b);
});
document.getElementById('btnLink').addEventListener('click',function(){toggle(linkPanel,this);});
/* клик по ссылке в тексте – меню с открытием */
editor.addEventListener('click',function(e){
var a=(e.target.closest)?e.target.closest('a'):null;
if(!a||!editor.contains(a))return;
e.preventDefault();
openLinkMenu(a,e.clientX,e.clientY);
});
function openExternal(url){
var x=document.createElement('a');
x.href=url;x.target='_blank';x.rel='noopener';x.style.display='none';
document.body.appendChild(x);x.click();x.remove();
}
function openLinkMenu(a,x,y){
linkMenu.innerHTML='';
function item(txt,fn){var b=document.createElement('button');b.className='item';b.textContent=txt;
b.addEventListener('click',function(){hide(linkMenu);fn();});linkMenu.appendChild(b);}
item('🔗 Открыть ссылку',function(){openExternal(a.getAttribute('href'));});
item('✎ Изменить адрес',function(){
var u=prompt('Адрес ссылки:',a.getAttribute('href'));
if(u!==null&&u.trim()){u=u.trim();if(!/^(https?:|mailto:)/i.test(u))u='https://'+u;
a.setAttribute('href',u);scheduleSave();}
});
linkMenu.classList.remove('hidden');
var w=linkMenu.offsetWidth,h=linkMenu.offsetHeight;
linkMenu.style.left=Math.min(Math.max(8,x),window.innerWidth-w-8)+'px';
linkMenu.style.top=Math.min(Math.max(8,y),window.innerHeight-h-8)+'px';
}
/* ═══════ цвет текста 🖌 ═══════ */
var TC=[['#000000','Чёрный'],['#7F7F7F','Серый'],['#C00000','Красный'],['#0000C0','Синий'],
['#008000','Зелёный'],['#7030A0','Фиолетовый'],['#CC3399','Розовый'],['#C65911','Оранжевый'],
['#BF9000','Жёлтый'],['#FFFFFF','Белый']];
TC.forEach(function(c){
var b=document.createElement('button');b.className='sw';b.style.background=c[0];b.title=c[1];
b.addEventListener('click',function(){exec('foreColor',c[0]);hide(colorPanel);});
colorPanel.appendChild(b);
});
document.getElementById('btnColor').addEventListener('click',function(){toggle(colorPanel,this);});
/* ═══════ маркер 🖍 ═══════ */
var HL=[['#FFF176','Лимонный'],['#FFB74D','Оранжевый'],['#A5D6A7','Зелёный'],['#CE93D8','Фиолетовый']];
HL.forEach(function(c){
var b=document.createElement('button');b.className='sw';b.style.background=c[0];b.title=c[1];
b.addEventListener('click',function(){exec('hiliteColor',c[0]);hide(hlPanel);});
hlPanel.appendChild(b);
});
var clr=document.createElement('button');clr.className='sw';clr.style.background='#fff';clr.title='Убрать маркер';
clr.innerHTML='<span style="color:#c00;font-size:15px">✕</span>';
clr.addEventListener('click',function(){exec('hiliteColor','transparent');hide(hlPanel);});
hlPanel.appendChild(clr);

/* ═══════ чек-лист символами ⬜⬛ (крупные) ═══════ */
var CHK_NO=['⬜'],CHK_YES=['⬛'];
function chkNo(c){return CHK_NO.indexOf(c)>-1;}
function chkYes(c){return CHK_YES.indexOf(c)>-1;}
function insertChecklist(){
var sel=window.getSelection();
var txt=sel.rangeCount?sel.toString():'';
if(txt&&txt.indexOf('\n')>-1){
var out=txt.split('\n').map(function(l){
return (/^[⬜⬛]( |$)/.test(l))?l:'⬜ '+l;
}).join('\n');
document.execCommand('insertText',false,out);
}else if(txt){
document.execCommand('insertText',false,'⬜ '+txt);
}else{
document.execCommand('insertText',false,'⬜ ');
}
scheduleSave();
}
editor.addEventListener('click',function(e){
var sel=window.getSelection();
if(!sel.rangeCount)return;
var n=sel.anchorNode;
if(!n||n.nodeType!==3)return;
var t=n.nodeValue,o=sel.anchorOffset,idx=-1;
if(o<t.length&&(chkNo(t[o])||chkYes(t[o])))idx=o;
else if(o>0&&(chkNo(t[o-1])||chkYes(t[o-1])))idx=o-1;
if(idx<0)return;
e.preventDefault();
n.nodeValue=t.slice(0,idx)+(chkNo(t[idx])?'⬛':'⬜')+t.slice(idx+1);
var r=document.createRange();r.setStart(n,idx+1);r.collapse(true);
sel.removeAllRanges();sel.addRange(r);
syncFromEditor();scheduleSave();
});
function currentLineEl(){
var sel=window.getSelection();if(!sel.rangeCount)return null;
var n=sel.anchorNode;if(!n)return null;
var el=(n.nodeType===1)?n:n.parentElement;
if(!el||el===editor)return null;
while(el&&el.parentElement!==editor)el=el.parentElement;
return el;
}
editor.addEventListener('keydown',function(e){
if(e.key!=='Enter'||e.ctrlKey||e.altKey||e.metaKey)return;
var el=currentLineEl();if(!el)return;
var t=(el.innerText||'').replace(/\u00a0/g,' ');
if(/^⬜\s*$/.test(t)){
e.preventDefault();
var r=document.createRange();r.selectNodeContents(el);
var s=window.getSelection();s.removeAllRanges();s.addRange(r);
document.execCommand('insertText',false,'');
return;
}
if(/^[⬜⬛]( |$)/.test(t)){
e.preventDefault();
document.execCommand('insertText',false,'\n⬜ ');
return;
}
});

function ensureSearchMenu(){

function pageText(html){var d=document.createElement('div');d.innerHTML=html;return d.textContent||'';}
function goToText(q){
var walker=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT,null);
var lower=q.toLowerCase();
while(walker.nextNode()){
var n=walker.currentNode;
var i=n.nodeValue.toLowerCase().indexOf(lower);
if(i>-1){
var r=document.createRange();
r.setStart(n,i);r.setEnd(n,i+q.length);
var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
var el=n.parentElement;if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});
return true;
}
}
return false;
}

function compress(file){
return new Promise(function(res){
if(file.type==="image/png"&&file.size<400000)return res({blob:file,ext:"png"});
var url=URL.createObjectURL(file),img=new Image();
img.onload=function(){
var max=1600,k=Math.min(1,max/Math.max(img.width,img.height));
var c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
c.toBlob(function(b){res({blob:b,ext:"jpg"});},"image/jpeg",.85);
};
img.onerror=function(){URL.revokeObjectURL(url);res({blob:file,ext:"jpg"});};
img.src=url;
});
}
function uploadImage(file,ph){
compress(file).then(function(r){
return new Promise(function(res){var rd=new FileReader();rd.onload=function(){res(rd.result);};rd.readAsDataURL(r.blob);});
}).then(function(durl){
var img=document.createElement('img');img.src=durl;img.alt='';
ph.replaceWith(img);scheduleSave();
}).catch(function(){ph.textContent='⚠ ошибка загрузки';setTimeout(function(){ph.remove();},2500);});

/* ═══════ Markdown экспорт/импорт ═══════ */
function mdInline(n){
if(n.nodeType===3)return n.nodeValue;
if(n.nodeType!==1)return '';
var t=n.tagName;
if(t==='BR')return '\n';
if(t==='B'||t==='STRONG')return '**'+mdKids(n)+'**';
if(t==='I'||t==='EM')return '*'+mdKids(n)+'*';
if(t==='S'||t==='STRIKE'||t==='DEL')return '~~'+mdKids(n)+'~~';
if(t==='A')return '['+mdKids(n)+']('+(n.getAttribute('href')||'')+')';
if(t==='IMG')return '![]('+(n.getAttribute('src')||'')+')';
if(t==='INPUT')return '';
return mdKids(n);
}
function mdKids(n){var s='';Array.prototype.forEach.call(n.childNodes,function(c){s+=mdInline(c);});return s;}
function mdBlocks(root,ind){
var out='',pad='';for(var k=0;k<ind;k++)pad+='  ';
Array.prototype.forEach.call(root.childNodes,function(c){
if(c.nodeType!==1)return;
var t=c.tagName;
if(t==='UL'||t==='OL'){
var ol=(t==='OL'),i=1;
Array.prototype.forEach.call(c.childNodes,function(li){
if(!li.tagName||li.tagName!=='LI')return;
var cb=li.querySelector('input[type=checkbox]');
var inline='',nested='';
Array.prototype.forEach.call(li.childNodes,function(x){
if(x.nodeType===1&&(x.tagName==='UL'||x.tagName==='OL'))nested+=mdBlocks(x,ind+1);
else inline+=mdInline(x);
});
inline=inline.replace(/\s+/g,' ').trim();
if(cb)out+=pad+'- ['+(cb.checked?'x':' ')+'] '+inline+'\n';
else if(ol)out+=pad+(i++)+'. '+inline+'\n';
else out+=pad+'- '+inline+'\n';
out+=nested;
});
return;
}
if(t==='DIV'||t==='P'){var s=mdKids(c).replace(/[ \t]+/g,' ').trim();
if(s){if(s.charAt(0)==='⬜')out+='\n- [ ] '+s.slice(1).trim()+'\n';
else if(s.charAt(0)==='⬛')out+='\n- [x] '+s.slice(1).trim()+'\n';
else out+='\n'+s+'\n';}
return;}
if(t==='BR'){out+='\n';return;}
out+=mdInline(c);
});
return out;
}

md=md.replace(/\n{3,}/g,'\n\n');

function mdInlineFmt(s){
s=esc(s);
s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">');
s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" style="color:#1a3d9c;text-decoration:underline">$1</a>');
s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
s=s.replace(/\*([^*]+)\*/g,'<i>$1</i>');
s=s.replace(/~~([^~]+)~~/g,'<s>$1</s>');
return s;
}
function mdToHtml(text){
var lines=String(text).replace(/\r\n?/g,'\n').split('\n');
var out=[],list=null;
function close(){if(list){out.push('</'+list+'>');list=null;}}
lines.forEach(function(ln){var m;
if(/^\s*$/.test(ln)){close();return;}
if(m=ln.match(/^[-*]\s+\[( |x|X)\]\s+(.*)$/)){
close();
out.push('<div>'+(m[1].toLowerCase()==='x'?'⬛ ':'⬜ ')+mdInlineFmt(m[2])+'</div>');return;}
if(m=ln.match(/^[-•*]\s+(.*)$/)){
if(list!=='ul'){close();list='ul';out.push('<ul>');}
out.push('<li>'+mdInlineFmt(m[1])+'</li>');return;}
if(m=ln.match(/^\d+[.)]\s+(.*)$/)){
if(list!=='ol'){close();list='ol';out.push('<ol>');}
out.push('<li>'+mdInlineFmt(m[1])+'</li>');return;}
close();
if(m=ln.match(/^#{1,6}\s+(.*)$/)){out.push('<div><b>'+mdInlineFmt(m[1])+'</b></div>');return;}
out.push('<div>'+mdInlineFmt(ln)+'</div>');
});
close();
return out.join('');
}
function doMdImport(){
var inp=document.createElement('input');inp.type='file';inp.accept='.md,.markdown,.txt';
inp.addEventListener('change',function(){
var f=inp.files&&inp.files[0];if(!f)return;
var rd=new FileReader();
rd.onload=function(){
var html=mdToHtml(rd.result);
if(!html){alert('Файл пустой или не распознан.');return;}
var r=document.createRange();r.selectNodeContents(editor);r.collapse(false);
var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
document.execCommand('insertHTML',false,html);
scheduleSave();
};
rd.readAsText(f);
});
inp.click();
}

/* ═══════ Backspace в пустом/начале списка → сразу обычный текст ═══════ */
function caretAtStartOfLi(){
var sel=window.getSelection();
if(!sel.rangeCount||!sel.isCollapsed)return null;
var n=sel.anchorNode;if(!n)return null;
var el=(n.nodeType===1)?n:n.parentElement, li=null;
while(el&&el!==editor){if(el.tagName==='LI'){li=el;break;}el=el.parentElement;}
if(!li)return null;
try{
var r=document.createRange();
r.selectNodeContents(li);
r.setEnd(sel.anchorNode,sel.anchorOffset);
if(r.toString()==='')return li;
}catch(e){}
return null;
}
/* ═══════ Backspace с телефона (экранная клавиатура) ═══════ */
editor.addEventListener('beforeinput',function(e){
if(e.inputType!=='deleteContentBackward')return;
var li=caretAtStartOfLi();
if(!li)return;
e.preventDefault();
var inOl=li.parentNode&&li.parentNode.tagName==='OL';
document.execCommand(inOl?'insertOrderedList':'insertUnorderedList',false,null);
scheduleSave();
});
/* ═══════ клавиши ═══════ */
document.addEventListener('keydown',function(e){
if(e.altKey&&!e.ctrlKey&&e.code==='Backspace'){e.preventDefault();exec('undo');return;}
if(e.altKey&&!e.ctrlKey&&e.code==='Enter'){e.preventDefault();exec('redo');return;}
if(e.key==='Backspace'&&!e.ctrlKey&&!e.altKey&&!e.metaKey){
var li=caretAtStartOfLi();
if(li){e.preventDefault();
var inOl=li.parentNode&&li.parentNode.tagName==='OL';
document.execCommand(inOl?'insertOrderedList':'insertUnorderedList',false,null);
scheduleSave();return;}
}
if(e.ctrlKey&&!e.altKey){
switch(e.code){
case 'KeyE':e.preventDefault();exec('justifyCenter');break;
case 'KeyR':e.preventDefault();exec('justifyRight');break;
case 'KeyJ':e.preventDefault();exec('justifyFull');break;
case 'KeyL':e.preventDefault();exec(e.shiftKey?'justifyLeft':'justifyFull');break;
case 'KeyY':e.preventDefault();exec('redo');break;
}
}
});
editor.addEventListener('input',function(){syncFromEditor();scheduleSave();keepCaretVisible();});
/* ═══════ курсор на виду: клавиатура на телефоне + запас снизу на ПК ═══════ */
function caretViewRect(){
var sel=window.getSelection();if(!sel||!sel.rangeCount)return null;
var r=sel.getRangeAt(0);
var rects=r.getClientRects(),rect=(rects&&rects.length)?rects[0]:null;
if(!rect||(rect.top===0&&rect.bottom===0&&rect.left===0&&rect.right===0)){
var m=document.createElement('span');m.textContent='\u200b';
try{
var rr=r.cloneRange();rr.collapse(false);rr.insertNode(m);
rect=m.getBoundingClientRect();
var par=m.parentNode;par.removeChild(m);if(par.normalize)par.normalize();
}catch(e){if(m.parentNode)m.parentNode.removeChild(m);}
}
return rect||null;
}
function keepCaretVisible(){
if(document.activeElement!==editor)return;
var rect=caretViewRect();if(!rect)return;
var er=editor.getBoundingClientRect();
var top=er.top+8,bottom=er.bottom-8;
if(window.visualViewport){
var vb=window.visualViewport.offsetTop+window.visualViewport.height;
if(vb<bottom)bottom=vb-8;
}
var margin=Math.max(60,Math.round(editor.clientHeight*0.22));
if(rect.bottom>bottom)editor.scrollTop+=rect.bottom-bottom+12;
else if(rect.bottom>bottom-margin)editor.scrollTop+=rect.bottom-(bottom-margin);
if(rect.top<top)editor.scrollTop-=top-rect.top+12;
}
document.addEventListener('selectionchange',function(){keepCaretVisible();});
window.addEventListener('resize',function(){keepCaretVisible();});
if(window.visualViewport){
window.visualViewport.addEventListener('resize',function(){keepCaretVisible();});
window.visualViewport.addEventListener('scroll',function(){keepCaretVisible();});
}

loadState(readLS());

if(document.visibilityState==='hidden'&&saveTimer){clearTimeout(saveTimer);saveTimer=null;save();}
});
/* ═══════ приложение (PWA) ═══════ */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();

<script>
/* конвертер PIN→хэш: долгий клик (~2 сек) по кнопке ☰ */
(function(){
function sha(s){
return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){
return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,"0");}).join("");
});
}
var mb=document.getElementById("btnMenu");
if(!mb)return;
var holdT=null,fired=false;
function askPin(){
var p=prompt("PIN для преобразования в SHA-256:");
if(p===null)return;
sha(p).then(function(h){prompt("Твой хэш для CONFIG_PIN_HASH:",h);});
}
function startHold(){clearTimeout(holdT);fired=false;holdT=setTimeout(function(){fired=true;askPin();},2000);}
function cancelHold(){clearTimeout(holdT);}
mb.addEventListener("mousedown",startHold);
mb.addEventListener("touchstart",startHold,{passive:true});
["mouseup","mouseleave","touchend","touchcancel"].forEach(function(ev){mb.addEventListener(ev,cancelHold);});
mb.addEventListener("contextmenu",function(e){e.preventDefault();});
document.addEventListener("click",function(e){
if(fired&&e.target&&e.target.closest&&e.target.closest("#btnMenu")){e.preventDefault();e.stopPropagation();fired=false;}
},true);
})();
</script>
